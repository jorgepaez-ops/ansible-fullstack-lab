<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ansible Fullstack Lab</title>
    <style>
        /* ────────────────────────────────────────────────────────────────────
           Estilos mínimos para el frontend del laboratorio.
           En producción usarías un framework CSS o archivos separados.
           ──────────────────────────────────────────────────────────────────── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; color: #1a1a2e; }
        p { font-size: 1.1rem; line-height: 1.6; color: #555; margin-bottom: 1rem; }
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 0.3rem;
        }
        .status { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #eee; }
        .status h2 { font-size: 1rem; color: #888; margin-bottom: 0.5rem; }
        #messages { font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Ansible Fullstack Lab</h1>
        <p>
            Este frontend fue desplegado automáticamente por Ansible
            usando el rol <code>frontend</code> con Nginx.
        </p>
        <div>
            <span class="badge">Nginx</span>
            <span class="badge">Spring Boot</span>
            <span class="badge">PostgreSQL</span>
            <span class="badge">Ansible</span>
            <span class="badge">Docker</span>
        </div>

        <!-- ──────────────────────────────────────────────────────────────────
             Sección dinámica: intenta conectar al backend API.
             Si el backend no está corriendo, muestra un mensaje amigable.
             ────────────────────────────────────────────────────────────────── -->
        <div class="status">
            <h2>Estado del Backend</h2>
            <p id="messages">Conectando al API...</p>
        </div>
    </div>

    <script>
        // ─────────────────────────────────────────────────────────────────────
        // Intento de conexión al backend Spring Boot
        // En el lab, Nginx hace proxy de /api hacia el backend.
        // Si no hay proxy configurado, intenta directo al puerto 8080.
        // ─────────────────────────────────────────────────────────────────────
        const apiUrl = '/api/messages';
        const fallbackUrl = 'http://localhost:8080/api/messages';

        async function fetchMessages() {
            const el = document.getElementById('messages');
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                el.textContent = `Conectado — ${data.length} mensaje(s) en la base de datos.`;
                el.style.color = '#27ae60';
            } catch (err) {
                el.textContent = `Backend no disponible (${err.message}). Esto es normal si solo desplegaste el frontend.`;
                el.style.color = '#e67e22';
            }
        }

        fetchMessages();
    </script>
</body>
</html>
