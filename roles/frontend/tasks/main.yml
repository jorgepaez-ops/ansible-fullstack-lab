- name: Instalar Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Copiar página HTML
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/index.html"
    dest: /var/www/html/index.html
    mode: "0644"

- name: Asegurar que Nginx esté iniciado
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
