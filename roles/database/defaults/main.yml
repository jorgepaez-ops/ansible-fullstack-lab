# =============================================================================
# roles/database/defaults/main.yml — Valores por defecto del rol database
# =============================================================================
#
# Estos valores se sobreescriben con group_vars/database.yml.
# Aquí definimos los "sensatos para lab" que funcionan sin configurar nada.
# =============================================================================

---
# ─────────────────────────────────────────────────────────────────────────────
# Versión y paquetes
# ─────────────────────────────────────────────────────────────────────────────
postgresql_version: "16"
postgresql_packages:
  - postgresql
  - postgresql-contrib
  - libpq-dev
  - python3-psycopg2

# ─────────────────────────────────────────────────────────────────────────────
# Base de datos
# ─────────────────────────────────────────────────────────────────────────────
pg_database: "messagesdb"

# ─────────────────────────────────────────────────────────────────────────────
# Usuario de aplicación
# ─────────────────────────────────────────────────────────────────────────────
pg_user: "demo"
pg_password: "demo"

# ─────────────────────────────────────────────────────────────────────────────
# Conexión
# ─────────────────────────────────────────────────────────────────────────────
pg_listen_addresses: "localhost"  # Por defecto solo localhost (seguro)
pg_port: 5432

# ─────────────────────────────────────────────────────────────────────────────
# Autenticación (pg_hba.conf)
# ─────────────────────────────────────────────────────────────────────────────
pg_hba_entries:
  - { type: "local", database: "all", user: "postgres", method: "peer" }
  - { type: "local", database: "all", user: "all", method: "md5" }
  - { type: "host", database: "all", user: "all", address: "127.0.0.1/32", method: "md5" }

# ─────────────────────────────────────────────────────────────────────────────
# Script SQL
# ─────────────────────────────────────────────────────────────────────────────
pg_init_script: "init.sql"
