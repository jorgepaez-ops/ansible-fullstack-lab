# =============================================================================
# ansible.cfg — Configuración global de Ansible para este proyecto
# =============================================================================
#
# CONCEPTO:
#   Ansible busca configuración en este orden (primero encontrado gana):
#     1. Variable de entorno ANSIBLE_CONFIG (ruta al archivo)
#     2. ./ansible.cfg (directorio actual — ESTE ARCHIVO)
#     3. ~/.ansible.cfg (home del usuario)
#     4. /etc/ansible/ansible.cfg (global del sistema)
#
#   Tener ansible.cfg en el directorio del proyecto es la práctica recomendada:
#   cada proyecto tiene su propia configuración sin afectar al sistema.
#
# DOCUMENTACIÓN COMPLETA:
#   ansible-config list         → Ver TODAS las opciones disponibles
#   ansible-config dump         → Ver valores actuales (cuál aplica)
#   https://docs.ansible.com/ansible/latest/reference_appendices/config.html
#
# NOTA:
#   Este archivo NO se sube a git si contiene secretos.
#   En este lab es seguro subirlo porque no tiene datos sensibles.
# =============================================================================

[defaults]
# ─────────────────────────────────────────────────────────────────────────────
# Inventario por defecto
# ─────────────────────────────────────────────────────────────────────────────
# Ruta al archivo de inventario. Si ejecutas `ansible-playbook playbook.yml`
# sin -i, Ansible usa este inventario automáticamente.
inventory = inventory.ini

# ─────────────────────────────────────────────────────────────────────────────
# Verificación de host keys SSH
# ─────────────────────────────────────────────────────────────────────────────
# False = no preguntar "Are you sure you want to continue connecting?"
# En lab con contenedores Docker esto es necesario porque las keys cambian
# cada vez que recreas los contenedores.
# ⚠️ En producción: SIEMPRE True (previene ataques man-in-the-middle)
host_key_checking = False

# ─────────────────────────────────────────────────────────────────────────────
# Archivos de retry
# ─────────────────────────────────────────────────────────────────────────────
# Cuando un playbook falla, Ansible crea un .retry con los hosts fallidos.
# Útil en producción: `ansible-playbook playbook.yml --limit @playbook.retry`
# En lab local solo genera basura, así que lo deshabilitamos.
retry_files_enabled = False

# ─────────────────────────────────────────────────────────────────────────────
# Intérprete de Python
# ─────────────────────────────────────────────────────────────────────────────
# "auto" detecta automáticamente la ubicación de Python en el host remoto.
# Elimina el warning "Platform python was not found" en Ubuntu modernos.
# Alternativa explícita: /usr/bin/python3
interpreter_python = auto

# ─────────────────────────────────────────────────────────────────────────────
# Formato de salida (stdout callback)
# ─────────────────────────────────────────────────────────────────────────────
# "yaml" muestra la salida de las tareas en formato YAML legible.
# Opciones: default, yaml, json, minimal, dense, debug
# "yaml" es ideal para aprender porque muestra la estructura de los datos.
stdout_callback = yaml

# ─────────────────────────────────────────────────────────────────────────────
# Callbacks adicionales habilitados
# ─────────────────────────────────────────────────────────────────────────────
# timer: muestra cuánto tardó cada tarea y el total al final
# profile_tasks: ordena tareas por duración (identifica cuellos de botella)
callbacks_enabled = timer, profile_tasks

# ─────────────────────────────────────────────────────────────────────────────
# Directorio de roles
# ─────────────────────────────────────────────────────────────────────────────
# Dónde Ansible busca roles cuando usas `roles:` en un playbook.
# Por defecto busca en ./roles/, pero puedes agregar más rutas.
roles_path = ./roles

# ─────────────────────────────────────────────────────────────────────────────
# Directorio de collections
# ─────────────────────────────────────────────────────────────────────────────
# Dónde Ansible instala/busca collections externas.
collections_path = ./collections:~/.ansible/collections

# ─────────────────────────────────────────────────────────────────────────────
# Forks (paralelismo)
# ─────────────────────────────────────────────────────────────────────────────
# Número de hosts que Ansible configura en PARALELO.
# Default: 5. Con 3 nodos, 5 es más que suficiente.
# En producción con 50+ hosts, subir a 20-30.
forks = 5

# ─────────────────────────────────────────────────────────────────────────────
# Timeout de conexión SSH
# ─────────────────────────────────────────────────────────────────────────────
# Segundos que espera antes de declarar un host inalcanzable.
timeout = 30

[privilege_escalation]
# ─────────────────────────────────────────────────────────────────────────────
# Escalación de privilegios (become)
# ─────────────────────────────────────────────────────────────────────────────
# become = true equivale a poner `become: true` en cada play.
# Aquí NO lo activamos globalmente — lo hacemos por play para ser explícitos.
# become_method: cómo escalar (sudo, su, doas, etc.)
# become_user: a QUÉ usuario escalar (default: root)
become = false
become_method = sudo
become_user = root

[ssh_connection]
# ─────────────────────────────────────────────────────────────────────────────
# Opciones SSH
# ─────────────────────────────────────────────────────────────────────────────
# ControlMaster: reutilizar conexiones SSH (más rápido con muchas tareas)
# ControlPersist: mantener la conexión abierta N segundos tras el último uso
# Pipelining: enviar módulos via stdin en vez de SFTP (más rápido, requiere
#   que el host remoto NO tenga `requiretty` en sudoers)
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
