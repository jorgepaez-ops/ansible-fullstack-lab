# =============================================================================
# inventory.ini — Inventario estático de hosts (formato INI)
# =============================================================================
#
# CONCEPTO:
#   El inventario define DÓNDE ejecutar las tareas. Lista todos los hosts
#   gestionados por Ansible, organizados en GRUPOS.
#
# FORMATOS DE INVENTARIO:
#   - INI (este archivo): simple, legible, ideal para labs y entornos pequeños
#   - YAML: más flexible, permite datos complejos anidados
#   - Dinámico: script/plugin que consulta AWS, Azure, etc. (ver ejercicio 09)
#
# ESTRUCTURA:
#   [nombre_del_grupo]         → Define un grupo
#   host1 variable1=valor      → Host con variables de conexión
#
#   Un host puede pertenecer a MÚLTIPLES grupos.
#   El grupo especial [all] incluye a TODOS los hosts automáticamente.
#
# VARIABLES DE CONEXIÓN:
#   ansible_host              → IP o hostname real del host
#   ansible_port              → Puerto SSH (default: 22)
#   ansible_user              → Usuario para conectar por SSH
#   ansible_ssh_private_key_file → Ruta a la llave privada SSH
#   ansible_python_interpreter → Ruta a Python en el host remoto
#   ansible_connection        → Tipo de conexión (ssh, local, docker)
#
# ESTE LAB:
#   Usamos contenedores Docker que exponen SSH en puertos diferentes.
#   Todos están en 127.0.0.1 pero en puertos 2221, 2222, 2223.
#
# COMANDOS ÚTILES:
#   ansible-inventory --list              → Ver inventario completo (JSON)
#   ansible-inventory --graph             → Ver gráfico de grupos
#   ansible all -m ping                   → Verificar conectividad
#   ansible frontend -m setup             → Recolectar facts de un grupo
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# Grupo: frontend — Servidor(es) web con Nginx
# ─────────────────────────────────────────────────────────────────────────────
# node1: contenedor Docker mapeado al puerto SSH 2221
[frontend]
node1 ansible_host=127.0.0.1 ansible_port=2221

# ─────────────────────────────────────────────────────────────────────────────
# Grupo: backend — Servidor(es) de aplicación con Spring Boot
# ─────────────────────────────────────────────────────────────────────────────
# node2: contenedor Docker mapeado al puerto SSH 2222
[backend]
node2 ansible_host=127.0.0.1 ansible_port=2222

# ─────────────────────────────────────────────────────────────────────────────
# Grupo: database — Servidor(es) de base de datos con PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
# node3: contenedor Docker mapeado al puerto SSH 2223
[database]
node3 ansible_host=127.0.0.1 ansible_port=2223

# ─────────────────────────────────────────────────────────────────────────────
# Variables compartidas por TODOS los hosts [all:vars]
# ─────────────────────────────────────────────────────────────────────────────
# Estas variables aplican a cada host del inventario.
# Son equivalentes a group_vars/all.yml pero dentro del inventario.
# Preferimos group_vars/ para variables complejas, aquí solo las de conexión.
[all:vars]
ansible_user=root
ansible_ssh_private_key_file=~/.ssh/id_rsa_ansible
ansible_python_interpreter=/usr/bin/python3

# ─────────────────────────────────────────────────────────────────────────────
# Grupo padre: webservers (agrupa frontend + backend)
# ─────────────────────────────────────────────────────────────────────────────
# Los grupos padres permiten ejecutar tareas en múltiples grupos a la vez.
# Ejemplo: ansible webservers -m ping → ping a node1 y node2
[webservers:children]
frontend
backend
